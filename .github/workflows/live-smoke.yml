name: live-smoke

# 对线上地址跑一遍冒烟检查。存在的理由有二：
#   1. 部署后验收（手动触发）；
#   2. 每天自动巡检一次，站点悄悄挂掉时会有记录，而不是等人发现。
on:
  workflow_dispatch:
    inputs:
      base:
        description: 要检查的站点根地址
        required: false
        default: https://paibook.lssa.fun
      check_purge:
        description: 是否额外验证"发布即生效"（需要仓库 secret ADMIN_PASSWORD）
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '20 1 * * *' # UTC 01:20 = 北京时间 09:20

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 冒烟检查线上地址
        run: bash scripts/smoke.sh "${{ github.event.inputs.base || 'https://paibook.lssa.fun' }}"

      # 手动勾选时才跑：它会在线上建一篇临时攻略、发布、再删掉。
      # 注意：secrets 上下文不能出现在步骤的 if 里（GitHub 会拒绝解析整个文件），
      # 所以这里只判断输入，secret 是否为空在 shell 里判断。
      - name: 验证「发布即生效」（边缘缓存 purge）
        if: ${{ github.event.inputs.check_purge == 'true' }}
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "${ADMIN_PASSWORD}" ]; then
            echo "::notice::仓库未配置 ADMIN_PASSWORD secret，跳过 purge 验收"
            exit 0
          fi
          bash scripts/verify-purge-live.sh
